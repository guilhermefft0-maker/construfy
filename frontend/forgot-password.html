<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstruPRO — Recuperar Senha</title>
  <link rel="stylesheet" href="global.css">
</head>
<body class="auth-page">

  <div class="wm-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" fill="white">
      <line x1="0" y1="820" x2="1440" y2="820" stroke="white" stroke-width="3"/>
      <rect x="40" y="340" width="230" height="480"/>
      <rect x="310" y="140" width="190" height="680"/>
      <rect x="712" y="60" width="18" height="760"/>
      <rect x="600" y="60" width="400" height="14"/>
      <rect x="1010" y="220" width="210" height="600"/>
      <rect x="1265" y="400" width="175" height="420"/>
      <line x1="0" y1="24" x2="1440" y2="24" stroke="white" stroke-width="0.5" stroke-dasharray="6 14"/>
      <line x1="24" y1="0" x2="24" y2="900" stroke="white" stroke-width="0.5" stroke-dasharray="6 14"/>
    </svg>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="auth-card" role="main">
    <div class="card-head">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21V9L12 3L21 9V21H15V15H9V21H3Z" fill="#090b0e"/></svg>
        </div>
        <span class="logo-text">Constru<span>PRO</span></span>
      </div>
      <h1 class="card-title">Recuperar senha</h1>
      <p class="card-desc">Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
    </div>

    <div class="card-body">
      <div class="alert alert-error"   id="error-msg"   role="alert"></div>
      <div class="alert alert-success" id="success-msg" role="status"></div>

      <!-- Estado: formulário -->
      <div id="form-state">
        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">E-mail cadastrado <span class="req">*</span></label>
            <input class="form-input" type="email" id="email" name="email" required maxlength="254"
                   autocomplete="email" placeholder="admin@suaconstrutora.com">
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">
            <span id="btn-label">Enviar link de recuperação</span>
          </button>
        </form>
      </div>

      <!-- Estado: e-mail enviado -->
      <div id="sent-state" style="display:none; text-align:center; padding: 8px 0 16px;">
        <div style="width:56px;height:56px;border-radius:50%;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
          <svg width="26" height="26" fill="none" stroke="#22c55e" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <p style="font-size:14px;color:var(--text-hi,#e8eaf0);font-weight:500;margin-bottom:8px">Verifique seu e-mail</p>
        <p style="font-size:13px;color:var(--text-md,#8b92a5);line-height:1.6">
          Se o endereço <strong id="sent-email" style="color:var(--text-hi,#e8eaf0)"></strong> estiver cadastrado,
          você receberá um link válido por <strong style="color:var(--amber,#f0a500)">15 minutos</strong>.
        </p>
        <p style="font-size:12px;color:var(--text-lo,#5a6075);margin-top:14px">
          Não recebeu? Verifique a pasta de spam ou
          <button id="resend-btn" style="background:none;border:none;color:var(--amber,#f0a500);font-size:12px;cursor:pointer;padding:0;font-family:inherit;text-decoration:underline" onclick="resetForm()">tente novamente</button>.
        </p>
      </div>
    </div>

    <div class="auth-footer">
      <a href="login.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-md,#8b92a5);text-decoration:none;font-size:13px">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar para o login
      </a>
    </div>
  </main>

  <script>
    const API_BASE = 'https://construpro-worker.guilhermefft0.workers.dev/api';

    function resetForm() {
      document.getElementById('form-state').style.display = '';
      document.getElementById('sent-state').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('email').value = '';
      const btn = document.getElementById('submit-btn');
      btn.disabled = false;
      document.getElementById('btn-label').textContent = 'Enviar link de recuperação';
    }

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn     = document.getElementById('submit-btn');
      const label   = document.getElementById('btn-label');
      const errorEl = document.getElementById('error-msg');

      errorEl.style.display = 'none';
      btn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Enviando...';

      const email = document.getElementById('email').value.trim().toLowerCase();

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Informe um e-mail válido.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Enviar link de recuperação';
        return;
      }

      try {
        // A API sempre retorna ok:true por segurança (não revela se o e-mail existe)
        await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        // Independente da resposta, mostramos o estado de "enviado"
        document.getElementById('sent-email').textContent = email;
        document.getElementById('form-state').style.display = 'none';
        document.getElementById('sent-state').style.display = '';

      } catch {
        errorEl.textContent = 'Erro de conexão. Verifique sua internet e tente novamente.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Enviar link de recuperação';
      }
    });
  </script>
</body>
</html>
