<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstruPRO — Criar Conta</title>
  <link rel="stylesheet" href="global.css">
</head>
<body class="auth-page">

  <div class="wm-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" fill="white">
      <line x1="0" y1="820" x2="1440" y2="820" stroke="white" stroke-width="3"/>
      <rect x="40" y="340" width="230" height="480"/>
      <rect x="310" y="140" width="190" height="680"/>
      <rect x="712" y="60" width="18" height="760"/>
      <rect x="600" y="60" width="400" height="14"/>
      <rect x="1010" y="220" width="210" height="600"/>
      <rect x="1265" y="400" width="175" height="420"/>
      <line x1="0" y1="24" x2="1440" y2="24" stroke="white" stroke-width="0.5" stroke-dasharray="6 14"/>
    </svg>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="auth-card" role="main">
    <div class="card-head">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21V9L12 3L21 9V21H15V15H9V21H3Z" fill="#090b0e"/></svg>
        </div>
        <span class="logo-text">Constru<span>PRO</span></span>
      </div>
      <div class="badge-pill"><span class="pulse-dot"></span>14 dias grátis</div>
      <h1 class="card-title">Criar sua conta</h1>
      <p class="card-desc">Preencha os dados da sua construtora para começar.</p>
    </div>

    <div class="card-body">
      <div class="alert alert-error"   id="error-msg"   role="alert"></div>
      <div class="alert alert-success" id="success-msg" role="status"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="company-name">Razão Social <span class="req">*</span></label>
          <input class="form-input" type="text" id="company-name" required maxlength="200" autocomplete="organization" placeholder="Construtora Exemplo Ltda">
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Telefone <span class="req">*</span></label>
          <input class="form-input" type="tel" id="phone" required maxlength="15" autocomplete="tel" placeholder="(11) 99999-9999">
        </div>

        <div class="section-divider"><span>Acesso do administrador</span></div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="admin-name">Nome <span class="req">*</span></label>
            <input class="form-input" type="text" id="admin-name" required maxlength="100" autocomplete="name" placeholder="João Silva">
          </div>
          <div class="form-group">
            <label class="form-label" for="admin-email">E-mail <span class="req">*</span></label>
            <input class="form-input" type="email" id="admin-email" required maxlength="254" autocomplete="email" placeholder="admin@construtora.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Senha <span class="req">*</span></label>
          <input class="form-input" type="password" id="admin-password" required minlength="12" autocomplete="new-password" placeholder="Mínimo 12 caracteres">
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span id="btn-label">Criar Conta Gratuitamente</span>
        </button>
      </form>

      <div class="feature-row">
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Obras &amp; Medições</div>
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Gestão de colaboradores</div>
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Sem cartão de crédito</div>
      </div>
    </div>

    <div class="auth-footer">Já tem conta? <a href="login.html">Fazer login</a></div>
  </main>

  <script>
    const API_BASE = 'https://construpro-worker.guilhermefft0.workers.dev/api';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn       = document.getElementById('submit-btn');
      const label     = document.getElementById('btn-label');
      const errorEl   = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');

      errorEl.style.display   = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Enviando...';

      const companyName   = document.getElementById('company-name').value.trim();
      const phone         = document.getElementById('phone').value.trim();
      const adminName     = document.getElementById('admin-name').value.trim();
      const adminEmail    = document.getElementById('admin-email').value.trim().toLowerCase();
      const adminPassword = document.getElementById('admin-password').value;

      if (!companyName || !phone || !adminName || !adminEmail || !adminPassword) {
        showError('Preencha todos os campos obrigatórios.');
        return;
      }
      if (adminPassword.length < 12) {
        showError('A senha deve ter pelo menos 12 caracteres.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            companyName,
            adminName,
            phone,
            email:    adminEmail,
            password: adminPassword,
          }),
        });

        const data = await res.json();

        if (data.ok || data.success) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('token_exp', String(Date.now() + (data.expires_in || 900) * 1000));
          localStorage.setItem('user', JSON.stringify(data.user));
          successEl.textContent = '✓ Conta criada! Redirecionando para o painel...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        } else {
          showError(data.message || data.error || 'Erro ao criar conta.');
        }
      } catch {
        showError('Erro de conexão. Tente novamente.');
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Criar Conta Gratuitamente';
      }
    });

    document.getElementById('phone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').substring(0, 11);
      if (v.length > 10)      v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      else if (v.length > 6)  v = v.replace(/^(\d{2})(\d{4})(\d*)$/,   '($1) $2-$3');
      else if (v.length > 2)  v = v.replace(/^(\d{2})(\d*)$/,           '($1) $2');
      this.value = v;
    });
  </script>
</body>
</html>
