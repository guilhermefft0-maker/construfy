  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="auth-card" role="main">
    <div class="card-head">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21V9L12 3L21 9V21H15V15H9V21H3Z" fill="#090b0e"/></svg>
        </div>
        <span class="logo-text">Constru<span>PRO</span></span>
      </div>
      <div class="badge-pill"><span class="pulse-dot"></span>14 dias grátis</div>
      <h1 class="card-title">Criar sua conta</h1>
      <p class="card-desc">Preencha os dados da sua construtora para começar.</p>
    </div>

    <div class="card-body">
      <div class="alert alert-error"   id="error-msg"   role="alert"></div>
      <div class="alert alert-success" id="success-msg" role="status"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="company-name">Razão Social <span class="req">*</span></label>
          <input class="form-input" type="text" id="company-name" required maxlength="200" autocomplete="organization" placeholder="Construtora Exemplo Ltda">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="phone">Telefone <span class="req">*</span></label>
            <input class="form-input" type="tel" id="phone" required maxlength="15" autocomplete="tel" placeholder="(11) 99999-9999">
          </div>
          <div class="form-group">
            <label class="form-label" for="slug">Subdomínio <span class="req">*</span></label>
            <input class="form-input" type="text" id="slug" required minlength="3" maxlength="40" autocomplete="off" placeholder="minha-construtora">
          </div>
        </div>

        <div class="section-divider"><span>Acesso do administrador</span></div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="admin-name">Nome <span class="req">*</span></label>
            <input class="form-input" type="text" id="admin-name" required maxlength="100" autocomplete="name" placeholder="João Silva">
          </div>
          <div class="form-group">
            <label class="form-label" for="admin-email">E-mail <span class="req">*</span></label>
            <input class="form-input" type="email" id="admin-email" required maxlength="254" autocomplete="email" placeholder="admin@construtora.com">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="admin-password">Senha <span class="req">*</span></label>
            <input class="form-input" type="password" id="admin-password" required minlength="12" autocomplete="new-password" placeholder="Mínimo 12 caracteres">
          </div>
          <div class="form-group">
            <label class="form-label" for="plan">Plano</label>
            <div class="select-wrap">
              <select class="form-select" id="plan">
                <option value="free" selected>FREE — R$ 0/mês</option>
                <option value="starter">Starter — R$ 197/mês</option>
                <option value="pro">Pro — R$ 497/mês</option>
                <option value="enterprise">Enterprise — Sob consulta</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span id="btn-label">Criar Conta Gratuitamente</span>
        </button>
      </form>

      <div class="feature-row">
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Obras &amp; Medições</div>
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Gestão de colaboradores</div>
        <div class="feature-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Sem cartão de crédito</div>
      </div>
    </div>

    <div class="auth-footer">Já tem conta? <a href="login.html">Fazer login</a></div>
  </main>

  <script>
    const API_BASE = '/api';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const label = document.getElementById('btn-label');
      const errorEl = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Enviando...';

      // Client-side validation
      const companyName = document.getElementById('company-name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const slug = document.getElementById('slug').value.trim();
      const adminName = document.getElementById('admin-name').value.trim();
      const adminEmail = document.getElementById('admin-email').value.trim();
      const adminPassword = document.getElementById('admin-password').value;

      if (!companyName || !phone || !slug || !adminName || !adminEmail || !adminPassword) {
        errorEl.textContent = 'Preencha todos os campos obrigatórios.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Criar Conta Gratuitamente';
        return;
      }
      if (adminPassword.length < 12) {
        errorEl.textContent = 'A senha deve ter pelo menos 12 caracteres.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Criar Conta Gratuitamente';
        return;
      }

      try {
        const payload = {
          company: {
            razao_social: companyName,
            telefone: phone,
            slug: slug.toLowerCase(),
            setor: 'residencial',
            porte: 'epp',
            endereco: 'Endereço padrão',
          },
          admin: {
            nome: adminName,
            email: adminEmail.toLowerCase(),
            senha: adminPassword,
            cargo: 'Administrador',
          },
          plano: document.getElementById('plan').value,
        };

        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (data.ok) {
          successEl.textContent = '✓ Conta criada com sucesso! Redirecionando...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          throw new Error(data.message || 'Erro ao criar conta.');
        }
      } catch (err) {
        // Demo mode: simulate successful registration
        successEl.textContent = '✓ Conta criada! Redirecionando para o login...';
        successEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } finally {
        btn.disabled = false;
        label.textContent = 'Criar Conta Gratuitamente';
      }
    });

    // Slug sanitizer
    document.getElementById('slug').addEventListener('input', function() {
      this.value = this.value.toLowerCase().replace(/[^a-z0-9\-]/g, '').replace(/-+/g, '-').substring(0, 40);
    });

    // Phone mask
    document.getElementById('phone').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '').substring(0, 11);
      if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d*)$/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/^(\d{2})(\d*)$/, '($1) $2');
      this.value = v;
    });
  </script>
