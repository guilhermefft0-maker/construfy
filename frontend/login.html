  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="auth-card" role="main">
    <div class="card-head">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21V9L12 3L21 9V21H15V15H9V21H3Z" fill="#090b0e"/></svg>
        </div>
        <span class="logo-text">Constru<span>PRO</span></span>
      </div>
      <h1 class="card-title">Bem-vindo de volta</h1>
      <p class="card-desc">Entre com suas credenciais para acessar o painel.</p>
    </div>

    <div class="card-body">
      <div class="alert alert-error"   id="error-msg"   role="alert"></div>
      <div class="alert alert-success" id="success-msg" role="status"></div>

      <div class="demo-box">
        <div class="demo-box-label">▸ Ambiente de demonstração</div>
        <div class="demo-row"><span>E-mail</span><span class="demo-val">admin@construtora.com</span></div>
        <div class="demo-row"><span>Senha</span><span class="demo-val">demo123456789</span></div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail <span class="req">*</span></label>
          <input class="form-input" type="email" id="email" name="email" required maxlength="254" autocomplete="email" placeholder="admin@suaconstrutora.com">
        </div>

        <div class="form-group">
          <div class="row-between">
            <label class="form-label" for="password" style="margin-bottom:0">Senha <span class="req">*</span></label>
            <a href="#" class="link-muted" onclick="return false;">Esqueceu a senha?</a>
          </div>
          <div class="pass-wrap">
            <input class="form-input" type="password" id="password" name="password" required minlength="8" autocomplete="current-password" placeholder="••••••••••••">
            <button type="button" class="pass-toggle" id="toggle-pass" aria-label="Mostrar senha">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span id="btn-label">Entrar na plataforma</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">Não tem conta? <a href="register.html">Criar conta grátis</a></div>
  </main>

  <script>
    const API_BASE = '/api';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const label = document.getElementById('btn-label');
      const errorEl = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Verificando...';

      try {
        const payload = {
          email: document.getElementById('email').value.trim().toLowerCase(),
          password: document.getElementById('password').value,
        };

        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (data.ok) {
          successEl.textContent = '✓ Login realizado! Redirecionando...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
        } else {
          throw new Error(data.message || 'Credenciais inválidas.');
        }
      } catch (err) {
        // Demo mode: allow demo credentials to pass through to dashboard
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        if (email === 'admin@construtora.com' && pass === 'demo123456789') {
          successEl.textContent = '✓ Login realizado! Redirecionando...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
        } else {
          errorEl.textContent = 'Use as credenciais de demonstração acima para acessar.';
          errorEl.style.display = 'block';
        }
      } finally {
        btn.disabled = false;
        label.textContent = 'Entrar na plataforma';
      }
    });

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      icon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });
  </script>
