<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstruPRO — Login</title>
  <link rel="stylesheet" href="global.css">
</head>
<body class="auth-page">

  <div class="wm-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" fill="white">
      <line x1="0" y1="820" x2="1440" y2="820" stroke="white" stroke-width="3"/>
      <rect x="40" y="340" width="230" height="480"/>
      <rect x="65" y="365" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="123" y="365" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="181" y="365" width="42" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="65" y="435" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="123" y="435" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="181" y="435" width="42" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="65" y="505" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="123" y="505" width="42" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="181" y="505" width="42" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="310" y="140" width="190" height="680"/>
      <rect x="332" y="165" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="165" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="165" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="332" y="235" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="235" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="235" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="332" y="305" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="305" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="305" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="332" y="375" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="375" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="375" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="332" y="445" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="445" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="445" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="332" y="515" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="388" y="515" width="40" height="50" fill="none" stroke="black" stroke-width="2"/><rect x="444" y="515" width="40" height="50" fill="none" stroke="black" stroke-width="2"/>
      <rect x="712" y="60" width="18" height="760"/>
      <rect x="600" y="60" width="400" height="14"/>
      <rect x="1010" y="220" width="210" height="600"/>
      <rect x="1265" y="400" width="175" height="420"/>
      <line x1="0" y1="24" x2="1440" y2="24" stroke="white" stroke-width="0.5" stroke-dasharray="6 14"/>
      <line x1="24" y1="0" x2="24" y2="900" stroke="white" stroke-width="0.5" stroke-dasharray="6 14"/>
    </svg>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="auth-card" role="main">
    <div class="card-head">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21V9L12 3L21 9V21H15V15H9V21H3Z" fill="#090b0e"/></svg>
        </div>
        <span class="logo-text">Constru<span>PRO</span></span>
      </div>
      <h1 class="card-title">Bem-vindo de volta</h1>
      <p class="card-desc">Entre com suas credenciais para acessar o painel.</p>
    </div>

    <div class="card-body">
      <div class="alert alert-error"   id="error-msg"   role="alert"></div>
      <div class="alert alert-success" id="success-msg" role="status"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail <span class="req">*</span></label>
          <input class="form-input" type="email" id="email" name="email" required maxlength="254"
                 autocomplete="email" placeholder="admin@suaconstrutora.com">
        </div>

        <div class="form-group">
          <div class="row-between">
            <label class="form-label" for="password" style="margin-bottom:0">Senha <span class="req">*</span></label>
            <a href="forgot-password.html" class="link-muted">Esqueceu a senha?</a>
          </div>
          <div class="pass-wrap">
            <input class="form-input" type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••••••">
            <button type="button" class="pass-toggle" id="toggle-pass" aria-label="Mostrar senha">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span id="btn-label">Entrar na plataforma</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">Não tem conta? <a href="register.html">Criar conta grátis</a></div>
  </main>

  <script>
    const API_BASE = 'https://construpro-worker.guilhermefft0.workers.dev/api';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn       = document.getElementById('submit-btn');
      const label     = document.getElementById('btn-label');
      const errorEl   = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');

      errorEl.style.display   = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Verificando...';

      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorEl.textContent = 'Preencha e-mail e senha.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Entrar na plataforma';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.ok) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('token_exp', String(Date.now() + (data.expires_in || 900) * 1000));
          // Normaliza user: worker retorna .nome, dashboard lê .nome || .name
          const user = { ...data.user, name: data.user?.nome || data.user?.name };
          localStorage.setItem('user', JSON.stringify(user));
          successEl.textContent = '✓ Login realizado! Redirecionando...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        } else {
          errorEl.textContent = data.message || 'Credenciais inválidas.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          label.textContent = 'Entrar na plataforma';
        }
      } catch {
        errorEl.textContent = 'Erro de conexão. Tente novamente.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Entrar na plataforma';
      }
    });

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp  = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      icon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });
  </script>
</body>
</html>
