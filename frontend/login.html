<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f12;
    --bg2: #13161b;
    --bg3: #1a1e25;
    --bg4: #222730;
    --border: #2a2f3a;
    --border2: #343b4a;
    --text: #e8eaf0;
    --text2: #8b92a5;
    --text3: #5a6075;
    --accent: #f0a500;
    --accent2: #c87e00;
    --green: #22c55e;
    --green2: #166534;
    --red: #ef4444;
    --red2: #7f1d1d;
    --blue: #3b82f6;
    --blue2: #1e3a6e;
    --purple: #a78bfa;
    --radius: 8px;
    --radius2: 12px;
    --sidebar: 220px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; height:100vh; overflow:hidden; display:flex; }

  /* SIDEBAR */
  #sidebar {
    width:var(--sidebar); min-width:var(--sidebar); background:var(--bg2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; overflow-y:auto;
  }
  .logo { padding:20px 18px 16px; border-bottom:1px solid var(--border); }
  .logo-mark { font-size:18px; font-weight:600; color:var(--accent); letter-spacing:-0.5px; }
  .logo-sub { font-size:10px; color:var(--text3); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
  .nav-section { padding:16px 0 4px; }
  .nav-label { font-size:9px; color:var(--text3); letter-spacing:1.8px; text-transform:uppercase; padding:0 18px 8px; }
  .nav-item {
    display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer;
    color:var(--text2); font-size:13px; font-weight:400; transition:all 0.15s; border-left:2px solid transparent;
  }
  .nav-item:hover { color:var(--text); background:var(--bg3); }
  .nav-item.active { color:var(--accent); background:rgba(240,165,0,0.07); border-left-color:var(--accent); }
  .nav-icon { width:16px; height:16px; opacity:0.7; flex-shrink:0; }
  .nav-item.active .nav-icon { opacity:1; }
  .sidebar-footer { margin-top:auto; padding:14px 18px; border-top:1px solid var(--border); }
  .user-pill { display:flex; align-items:center; gap:10px; }
  .user-avatar { width:30px; height:30px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#000; }
  .user-name { font-size:12px; color:var(--text2); }

  /* MAIN */
  #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #topbar {
    height:52px; background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 24px; gap:12px;
  }
  .topbar-title { font-size:15px; font-weight:500; color:var(--text); flex:1; }
  .topbar-badge { background:var(--bg4); border:1px solid var(--border2); color:var(--text2); font-size:11px; padding:3px 10px; border-radius:20px; }
  .btn { 
    display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:var(--radius);
    font-size:12px; font-weight:500; cursor:pointer; border:none; font-family:var(--font); transition:all 0.15s;
  }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:hover { background:var(--accent2); }
  .btn-outline { background:transparent; border:1px solid var(--border2); color:var(--text2); }
  .btn-outline:hover { background:var(--bg4); color:var(--text); }
  .btn-danger { background:transparent; border:1px solid var(--red2); color:var(--red); }
  .btn-success { background:rgba(34,197,94,0.1); border:1px solid var(--green2); color:var(--green); }

  #content { flex:1; overflow-y:auto; padding:24px; }

  /* CARDS */
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .kpi-card {
    background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:18px;
  }
  .kpi-label { font-size:11px; color:var(--text3); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:8px; }
  .kpi-value { font-size:24px; font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
  .kpi-value.green { color:var(--green); }
  .kpi-value.amber { color:var(--accent); }
  .kpi-value.red { color:var(--red); }
  .kpi-change { font-size:11px; color:var(--text3); margin-top:6px; }

  /* TABLES */
  .table-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); overflow:hidden; margin-bottom:20px; }
  .table-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .table-title { font-size:13px; font-weight:500; color:var(--text); }
  .table-sub { font-size:11px; color:var(--text3); margin-top:2px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 16px; font-size:10px; color:var(--text3); letter-spacing:1.2px; text-transform:uppercase; border-bottom:1px solid var(--border); font-weight:500; }
  td { padding:11px 16px; font-size:13px; color:var(--text2); border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:var(--bg3); }
  td .strong { color:var(--text); font-weight:500; }

  /* BADGES */
  .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; }
  .badge-green { background:rgba(34,197,94,0.12); color:var(--green); }
  .badge-amber { background:rgba(240,165,0,0.12); color:var(--accent); }
  .badge-red { background:rgba(239,68,68,0.12); color:var(--red); }
  .badge-blue { background:rgba(59,130,246,0.12); color:var(--blue); }
  .badge-gray { background:var(--bg4); color:var(--text3); }

  /* FORMS */
  .form-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100;
    align-items:center; justify-content:center;
  }
  .form-overlay.open { display:flex; }
  .form-box {
    background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius2);
    padding:24px; width:560px; max-height:85vh; overflow-y:auto;
  }
  .form-title { font-size:15px; font-weight:500; color:var(--text); margin-bottom:18px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group.full { grid-column:1/-1; }
  label { font-size:11px; color:var(--text3); letter-spacing:0.5px; }
  input, select, textarea {
    background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:var(--radius);
    padding:8px 12px; font-size:13px; font-family:var(--font); outline:none; transition:border 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  select option { background:var(--bg3); }
  .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }

  /* TABS */
  .tabs { display:flex; gap:2px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:3px; margin-bottom:20px; width:fit-content; }
  .tab { padding:6px 16px; border-radius:6px; font-size:12px; cursor:pointer; color:var(--text3); transition:all 0.15s; }
  .tab.active { background:var(--bg2); color:var(--text); border:1px solid var(--border2); }

  /* PROGRESS BAR */
  .progress-bar { height:5px; background:var(--bg4); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:3px; background:var(--accent); transition:width 0.3s; }
  .progress-fill.green { background:var(--green); }
  .progress-fill.red { background:var(--red); }

  /* GRID LAYOUTS */
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }

  /* CHART BARS */
  .mini-chart { display:flex; align-items:flex-end; gap:4px; height:60px; }
  .bar-col { flex:1; background:rgba(240,165,0,0.15); border-radius:3px 3px 0 0; border-top:2px solid var(--accent); min-height:4px; transition:height 0.3s; }
  .bar-col.green { background:rgba(34,197,94,0.15); border-top-color:var(--green); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

  /* DETAIL PANEL */
  .detail-panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:20px; }
  .detail-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color:var(--text3); }
  .detail-value { color:var(--text); font-weight:500; font-variant-numeric:tabular-nums; }

  /* OBRA CARD */
  .obra-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .obra-card {
    background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:16px; cursor:pointer; transition:all 0.15s;
  }
  .obra-card:hover { border-color:var(--border2); background:var(--bg3); }
  .obra-card.selected { border-color:var(--accent); }
  .obra-name { font-size:13px; font-weight:500; color:var(--text); margin-bottom:4px; }
  .obra-client { font-size:11px; color:var(--text3); margin-bottom:12px; }
  .obra-stats { display:flex; justify-content:space-between; margin-bottom:10px; }
  .obra-stat-val { font-size:16px; font-weight:500; color:var(--accent); }
  .obra-stat-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; }

  /* FOLHA RESUMO */
  .folha-box { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; }
  .folha-item { display:flex; justify-content:space-between; padding:5px 0; font-size:12px; }
  .folha-item.total { border-top:1px solid var(--border2); margin-top:6px; padding-top:10px; font-weight:500; font-size:13px; color:var(--text); }
  .folha-deduct { color:var(--red); }
  .folha-plus { color:var(--green); }

  /* NOTIFICATION DOT */
  .dot { width:6px; height:6px; border-radius:50%; background:var(--red); }
  .dot.green { background:var(--green); }
  .dot.amber { background:var(--accent); }

  /* SEARCH BAR */
  .search-bar { position:relative; }
  .search-bar input { padding-left:32px; width:220px; }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); }

  /* ANIMACAO ENTRADA */
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .page { animation:fadeIn 0.2s ease; }

  .section-title { font-size:13px; font-weight:500; color:var(--text); margin-bottom:12px; }

  /* PRINT / PDF */
  @media print {
    #sidebar, #topbar { display:none; }
    #content { padding:0; overflow:visible; }
    body { height:auto; overflow:visible; }
    .table-card { border:1px solid #ccc; }
  }
</style>

// ═══════════════════════════════════════════════════════════
//  CÁLCULOS CLT (tabelas 2024)
// ═══════════════════════════════════════════════════════════
function calcularINSS(salario) {
  // Tabela INSS 2024 (progressiva)
  const faixas = [
    { ate: 1412.00, aliq: 0.075 },
    { ate: 2666.68, aliq: 0.09 },
    { ate: 4000.03, aliq: 0.12 },
    { ate: 7786.02, aliq: 0.14 },
  ];
  let inss = 0, base = 0;
  const limites = [1412.00, 2666.68, 4000.03, 7786.02];
  const aliq = [0.075, 0.09, 0.12, 0.14];
  for (let i = 0; i < limites.length; i++) {
    const prev = i === 0 ? 0 : limites[i-1];
    if (salario > prev) {
      const tributavel = Math.min(salario, limites[i]) - prev;
      inss += tributavel * aliq[i];
    }
    if (salario <= limites[i]) break;
  }
  return Math.min(inss, 7786.02 * 0.14); // teto
}

function calcularIRRF(salarioBruto, inss) {
  const baseCalculo = salarioBruto - inss;
  // Tabela IRRF 2024
  const faixas = [
    { ate: 2259.20, aliq: 0, deducao: 0 },
    { ate: 2826.65, aliq: 0.075, deducao: 169.44 },
    { ate: 3751.05, aliq: 0.15, deducao: 381.44 },
    { ate: 4664.68, aliq: 0.225, deducao: 662.77 },
    { ate: Infinity, aliq: 0.275, deducao: 896.00 },
  ];
  for (const f of faixas) {
    if (baseCalculo <= f.ate) {
      const irrf = baseCalculo * f.aliq - f.deducao;
      return Math.max(0, irrf);
    }
  }
  return 0;
}

function calcularFGTS(salario) { return salario * 0.08; }

function calcularProvisao13(salario) { return salario / 12; }

function calcularProvisaoFerias(salario) { return (salario / 12) * (1 + 1/3); }

function calcularLiquidoCLT(salario) {
  const inss = calcularINSS(salario);
  const irrf = calcularIRRF(salario, inss);
  const fgts = calcularFGTS(salario);
  const prov13 = calcularProvisao13(salario);
  const provFerias = calcularProvisaoFerias(salario);
  const liquido = salario - inss - irrf;
  const custoTotal = salario + fgts + prov13 + provFerias;
  return { inss, irrf, fgts, prov13, provFerias, liquido, custoTotal };
}

function navigate(page) {
  APP.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.nav-item');
  items.forEach(el => { if (el.getAttribute('onclick')?.includes(`'${page}'`)) el.classList.add('active'); });
  document.getElementById('page-title').textContent = pageTitles[page] || page;
  renderPage(page);
}

function renderPage(page) {
  const el = document.getElementById('content');

    <div class="table-card" style="margin-bottom:16px">
      <div class="table-header">
        <div>
          <div class="table-title">${obra.nome}</div>
          <div class="table-sub">${meds.length} medições · Total medido: ${fmt(total)}</div>
        </div>
        <span class="badge ${obra.status==='Em andamento'?'badge-green':'badge-gray'}">${obra.status}</span>
      </div>
      <table>
        <thead><tr><th>Nº Medição</th><th>Data</th><th>Valor</th><th>Responsável</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>
          ${meds.map(m => `<tr>
            <td><span class="strong">${m.numero}</span></td>
            <td>${fmtDate(m.data)}</td>
            <td style="font-family:var(--mono);color:var(--accent);font-weight:500">${fmt(m.valor)}</td>
            <td>${m.responsavel}</td>
            <td><span class="badge ${m.status==='Aprovada'?'badge-green':m.status==='Faturada'?'badge-blue':'badge-amber'}">${m.status}</span></td>
            <td><button class="btn btn-outline" style="padding:4px 8px;font-size:11px" onclick="alterarStatusMedicao(${m.id})">Alterar status</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('')}`;
}

function alterarStatusMedicao(id) {
  const m = APP.medicoes.find(x => x.id===id);
  if (!m) return;
  const ops = ['Pendente','Em análise','Aprovada','Faturada'];
  const cur = ops.indexOf(m.status);
  m.status = ops[(cur+1) % ops.length];
  navigate('medicoes');
}

function salvarMedicao() {
  const obraId = parseInt(document.getElementById('f-obra').value);

        <div class="folha-box">
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px">DADOS DO DIARISTA</div>

  const nome = document.getElementById('f-nome').value;

  const tipo = document.getElementById('f-tipo').value;

function renderFolha() {
  const clts = APP.colaboradores.filter(c => c.tipo==='CLT' && c.status==='Ativo');
  const diaristas = APP.colaboradores.filter(c => c.tipo==='Diarista' && c.status==='Ativo');

  const totaisGerais = clts.reduce((acc, c) => {
    const calc = calcularLiquidoCLT(c.salario);
    return {
      bruto: acc.bruto + c.salario,
      inss: acc.inss + calc.inss,
      irrf: acc.irrf + calc.irrf,
      liquido: acc.liquido + calc.liquido,
      fgts: acc.fgts + calc.fgts,
      prov13: acc.prov13 + calc.prov13,
      provFerias: acc.provFerias + calc.provFerias,
      custo: acc.custo + calc.custoTotal,
    };
  }, { bruto:0, inss:0, irrf:0, liquido:0, fgts:0, prov13:0, provFerias:0, custo:0 });

  const totalDiaristas = diaristas.reduce((a,c) => a + c.salario*(c.diasTrabalhados||0), 0);

  return `
  <div style="font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px">Folha de Pagamento</div>

      <div class="kpi-value green">${fmt(totaisGerais.liquido)}</div>

      <div class="kpi-label">Total Diaristas</div>
      <div class="kpi-value amber">${fmt(totalDiaristas)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Custo Total Empresa</div>
      <div class="kpi-value red">${fmt(totaisGerais.custo + totalDiaristas)}</div>
    </div>
  </div>

  <div class="table-card" style="margin-bottom:16px">
    <div class="table-header">
      <div>
        <div class="table-title">Folha CLT — Competência ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div>
        <div class="table-sub">Cálculo progressivo INSS + IRRF conforme tabelas vigentes 2024</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Colaborador</th><th>Cargo</th><th>Obra</th>
          <th>Bruto</th><th>INSS</th><th>IRRF</th>
          <th>Líquido</th><th>FGTS</th><th>Custo Total</th>
        </tr>
      </thead>
      <tbody>
        ${clts.map(c => {
          const calc = calcularLiquidoCLT(c.salario);
          const obra = getObra(c.obraId);
          return `<tr>
            <td><span class="strong">${c.nome}</span></td>
            <td>${c.cargo}</td>
            <td style="font-size:11px">${obra?.nome?.substring(0,16)||'—'}...</td>
            <td style="font-family:var(--mono)">${fmt(c.salario)}</td>
            <td style="font-family:var(--mono);color:var(--red)">- ${fmt(calc.inss)}</td>
            <td style="font-family:var(--mono);color:var(--red)">- ${fmt(calc.irrf)}</td>
            <td style="font-family:var(--mono);color:var(--green);font-weight:500">${fmt(calc.liquido)}</td>
            <td style="font-family:var(--mono);color:var(--text3)">${fmt(calc.fgts)}</td>
            <td style="font-family:var(--mono);color:var(--accent);font-weight:500">${fmt(calc.custoTotal)}</td>
          </tr>`;
        }).join('')}

          <td style="font-family:var(--mono);font-weight:500">${fmt(totaisGerais.bruto)}</td>

        </tr>
      </tbody>
    </table>
  </div>

    <div class="table-card">
      <div class="table-header"><div class="table-title">Diaristas do mês</div></div>
      <table>
        <thead><tr><th>Nome</th><th>Dias</th><th>Diária</th><th>Total</th></tr></thead>

function renderEPIs() {
  return `

  <div class="table-card" style="margin-bottom:16px">
    <div class="table-header"><div class="table-title">Estoque de EPIs</div></div>

      <thead><tr><th>EPI</th><th>Categoria</th><th>CA</th><th>Estoque</th><th>Mínimo</th><th>Validade</th><th>Status</th></tr></thead>

          return `<tr>
            <td><span class="strong">${e.nome}</span></td>
            <td>${e.categoria}</td>
            <td style="font-family:var(--mono);font-size:12px">${e.ca}</td>

                <div class="progress-bar" style="width:60px">
                  <div class="progress-fill ${e.estoque>=e.minimo?'green':'red'}" style="width:${Math.min(pct,100)}%"></div>
                </div>
              </div>
            </td>
            <td style="font-family:var(--mono)">${e.minimo}</td>
            <td>${fmtDate(e.validade)}</td>

  <div class="table-card">

            <td>${fmtDate(e.data)}</td>
            <td style="font-family:var(--mono)">${e.quantidade}</td>
            <td><span class="badge ${e.devolvida?'badge-green':'badge-amber'}">${e.devolvida?'Sim':'Em uso'}</span></td>

    </table>

function salvarEPI() {
  const nome = document.getElementById('f-nome').value;
  const categoria = document.getElementById('f-cat').value;
  const ca = document.getElementById('f-ca').value;
  const estoque = parseInt(document.getElementById('f-estoque').value)||0;
  const minimo = parseInt(document.getElementById('f-min').value)||0;
  const validade = document.getElementById('f-val').value;
  if (!nome) { alert('Informe o nome do EPI.'); return; }
  APP.epis.push({ id:APP.epis.length+1, nome, categoria, ca, estoque, minimo, validade });
  closeForm(); navigate('epis');
}

function openFormEntregaEPI() {
  document.getElementById('form-box').innerHTML = `
    <div class="form-title">Registrar Entrega de EPI</div>
    <div class="form-grid">
      <div class="form-group full"><label>EPI</label>
        <select id="f-epi">${APP.epis.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}</select></div>
      <div class="form-group full"><label>Colaborador</label>
        <select id="f-col">${APP.colaboradores.filter(c=>c.status==='Ativo').map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select></div>
      <div class="form-group"><label>Data de Entrega</label><input type="date" id="f-data"></div>
      <div class="form-group"><label>Quantidade</label><input type="number" value="1" id="f-qtd"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEntregaEPI()">Registrar</button>
    </div>`;
  document.getElementById('form-overlay').classList.add('open');
}

function salvarEntregaEPI() {
  const epiId = parseInt(document.getElementById('f-epi').value);
  const colaboradorId = parseInt(document.getElementById('f-col').value);
  const data = document.getElementById('f-data').value;
  const quantidade = parseInt(document.getElementById('f-qtd').value)||1;
  const epi = getEPI(epiId);
  if (epi && epi.estoque >= quantidade) {
    epi.estoque -= quantidade;
    APP.entregasEPI.push({ id:APP.entregasEPI.length+1, epiId, colaboradorId, data, quantidade, devolvida:false });
    closeForm(); navigate('epis');
  } else {
    alert('Estoque insuficiente para esta entrega.');
  }
}

function renderFinanceiro() {
  const receitas = APP.financeiro.filter(f=>f.tipo==='Receita').reduce((a,b)=>a+b.valor,0);
  const despesas = APP.financeiro.filter(f=>f.tipo==='Despesa').reduce((a,b)=>a+b.valor,0);
  const resultado = receitas - despesas;

  // Categorias de despesa
  const catDespesas = {};
  APP.financeiro.filter(f=>f.tipo==='Despesa').forEach(f => {
    catDespesas[f.categoria] = (catDespesas[f.categoria]||0) + f.valor;
  });

  return `
  <div style="font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px">Financeiro</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:20px">Fluxo de caixa, DRE e controle por obra</div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Total de Receitas</div>
      <div class="kpi-value green">${fmt(receitas)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total de Despesas</div>
      <div class="kpi-value red">${fmt(despesas)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Resultado</div>
      <div class="kpi-value ${resultado>=0?'green':'red'}">${fmt(resultado)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Margem Líquida</div>
      <div class="kpi-value amber">${receitas>0?(resultado/receitas*100).toFixed(1)+'%':'—'}</div>
    </div>
  </div>

  <div class="two-col" style="margin-bottom:16px">
    <div class="table-card">
      <div class="table-header"><div class="table-title">Despesas por Categoria</div></div>
      <div style="padding:16px">
        ${Object.entries(catDespesas).map(([cat, val]) => `
          <div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px">
              <span style="font-size:12px;color:var(--text)">${cat}</span>
              <span style="font-size:12px;font-family:var(--mono);color:var(--red)">${fmt(val)}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill red" style="width:${Math.round(val/despesas*100)}%"></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="table-card">
      <div class="table-header"><div class="table-title">DRE Simplificado</div></div>
      <div style="padding:16px">
        <div class="folha-box">
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Demonstrativo</div>
          <div class="folha-item"><span style="font-weight:500">Receita Bruta</span><span class="folha-plus">${fmt(receitas)}</span></div>
          ${Object.entries(catDespesas).map(([cat,val])=>`
            <div class="folha-item"><span style="font-size:12px;color:var(--text3)">${cat}</span><span class="folha-deduct">- ${fmt(val)}</span></div>
          `).join('')}
          <div class="folha-item total"><span>Resultado Período</span><span style="color:${resultado>=0?'var(--green)':'var(--red)'}">${fmt(resultado)}</span></div>
        </div>
      </div>

  <div class="table-card">

      <tbody>
        ${APP.financeiro.map(f => {
          const obra = getObra(f.obraId);
          return `<tr>
            <td><span class="badge ${f.tipo==='Receita'?'badge-green':'badge-red'}">${f.tipo}</span></td>
            <td><span class="strong">${f.descricao}</span></td>
            <td><span class="badge badge-gray">${f.categoria}</span></td>
            <td style="font-size:11px;color:var(--text3)">${obra?.nome?.substring(0,16)||'Geral'}${obra?'...':''}</td>
            <td>${fmtDate(f.data)}</td>
            <td style="font-family:var(--mono);font-weight:500;color:${f.tipo==='Receita'?'var(--green)':'var(--red)'}">${f.tipo==='Despesa'?'- ':'+ '}${fmt(f.valor)}</td>

// ═══════════════════════════════════════════════════════════
//  GERAÇÃO DE PDF (jsPDF)
// ═══════════════════════════════════════════════════════════
function pdfHeader(doc, titulo, subtitulo) {
  doc.setFillColor(13, 15, 18);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(240, 165, 0);
  doc.setFontSize(16);
  doc.setFont('helvetica','bold');
  doc.text('ConstruPRO', 14, 14);
  doc.setTextColor(200, 200, 200);
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.text(APP.empresa.nome + ' · ' + APP.empresa.cnpj, 14, 21);
  doc.setTextColor(255,255,255);
  doc.setFontSize(11);
  doc.setFont('helvetica','bold');
  doc.text(titulo, 210-14, 12, { align:'right' });
  doc.setTextColor(180,180,180);
  doc.setFontSize(8);
  doc.setFont('helvetica','normal');
  doc.text(subtitulo || new Date().toLocaleDateString('pt-BR', { dateStyle:'full' }), 210-14, 20, { align:'right' });
  return 36;
}

function gerarPDFGeral() {
  const doc = new window.jspdf.jsPDF();
  let y = pdfHeader(doc, 'Relatório Geral', 'Consolidado completo da empresa');

  doc.setFontSize(10); doc.setTextColor(50,50,50);
  doc.setFont('helvetica','bold');
  doc.text('RESUMO EXECUTIVO', 14, y);
  y += 6;

  const receitas = APP.financeiro.filter(f=>f.tipo==='Receita').reduce((a,b)=>a+b.valor,0);
  const despesas = APP.financeiro.filter(f=>f.tipo==='Despesa').reduce((a,b)=>a+b.valor,0);
  const resultado = receitas - despesas;

  const resumo = [
    ['Obras ativas', APP.obras.filter(o=>o.status==='Em andamento').length + ' obras'],
    ['Colaboradores CLT', APP.colaboradores.filter(c=>c.tipo==='CLT'&&c.status==='Ativo').length + ' colaboradores'],
    ['Total Faturado (recebido)', fmt(APP.faturamentos.filter(f=>f.status==='Recebida').reduce((a,b)=>a+b.valor,0))],
    ['Total Receitas', fmt(receitas)],
    ['Total Despesas', fmt(despesas)],
    ['Resultado do Período', fmt(resultado)],
    ['Margem Líquida', receitas>0?(resultado/receitas*100).toFixed(1)+'%':'—'],
  ];

  doc.autoTable({
    startY: y, head: [['Indicador', 'Valor']],
    body: resumo,
    styles: { fontSize: 9 },
    headStyles: { fillColor: [240,165,0], textColor: [0,0,0] },
    alternateRowStyles: { fillColor: [248,248,248] },
    margin: { left: 14, right: 14 }
  });

  y = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.text('OBRAS', 14, y);
  y += 4;

  doc.autoTable({
    startY: y,
    head: [['Obra','Cliente','Contrato','Status','Avanço']],
    body: APP.obras.map(o => [o.nome, o.cliente, o.contrato, o.status, o.avanco+'%']),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [50,55,65], textColor: [255,255,255] },
    margin: { left: 14, right: 14 }
  });

  doc.save('ConstruPRO_Relatorio_Geral.pdf');
}

    styles: { fontSize: 8 },

    margin: { left: 14, right: 14 }
  });

  doc.save('ConstruPRO_Obras_Medicoes.pdf');
}

function gerarPDFFaturamento() {
  const doc = new window.jspdf.jsPDF();
  let y = pdfHeader(doc, 'Faturamento', '');

  const totalRecebido = APP.faturamentos.filter(f=>f.status==='Recebida').reduce((a,b)=>a+b.valor,0);
  const totalPendente = APP.faturamentos.filter(f=>f.status==='Pendente').reduce((a,b)=>a+b.valor,0);

  doc.autoTable({
    startY: y,
    head: [['NF','Obra','Emissão','Vencimento','Valor','Forma','Status']],
    body: APP.faturamentos.map(f => {
      const obra = getObra(f.obraId);
      return [f.numero, obra?.nome||'—', fmtDate(f.data), fmtDate(f.vencimento), fmt(f.valor), f.formaPgto, f.status];
    }),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [34,197,94], textColor: [0,0,0] },
    margin: { left: 14, right: 14 }
  });

  y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(9);
  doc.setTextColor(50,50,50);
  doc.text(`Total Recebido: ${fmt(totalRecebido)}    A Receber: ${fmt(totalPendente)}`, 14, y);

  doc.save('ConstruPRO_Faturamento.pdf');
}

function gerarPDFFolha() {
  const doc = new window.jspdf.jsPDF({ orientation:'landscape' });
  let y = pdfHeader(doc, 'Folha de Pagamento', 'Tabelas INSS e IRRF 2024');

  const clts = APP.colaboradores.filter(c => c.tipo==='CLT' && c.status==='Ativo');
  const body = clts.map(c => {
    const calc = calcularLiquidoCLT(c.salario);
    const obra = getObra(c.obraId);
    return [c.nome, c.cargo, obra?.nome||'—', fmt(c.salario), fmt(calc.inss), fmt(calc.irrf), fmt(calc.liquido), fmt(calc.fgts), fmt(calc.prov13), fmt(calc.provFerias), fmt(calc.custoTotal)];
  });

  const totaisGerais = clts.reduce((acc, c) => {
    const calc = calcularLiquidoCLT(c.salario);
    return { bruto:acc.bruto+c.salario, inss:acc.inss+calc.inss, irrf:acc.irrf+calc.irrf, liquido:acc.liquido+calc.liquido, fgts:acc.fgts+calc.fgts, p13:acc.p13+calc.prov13, pf:acc.pf+calc.provFerias, custo:acc.custo+calc.custoTotal };
  }, { bruto:0,inss:0,irrf:0,liquido:0,fgts:0,p13:0,pf:0,custo:0 });

  body.push(['TOTAL','','', fmt(totaisGerais.bruto), fmt(totaisGerais.inss), fmt(totaisGerais.irrf), fmt(totaisGerais.liquido), fmt(totaisGerais.fgts), fmt(totaisGerais.p13), fmt(totaisGerais.pf), fmt(totaisGerais.custo)]);

  doc.autoTable({
    startY: y,
    head: [['Nome','Cargo','Obra','Bruto','INSS','IRRF','Líquido','FGTS','Prov.13º','Prov.Férias','Custo Total']],
    body,
    styles: { fontSize: 7 },
    headStyles: { fillColor: [167,139,250], textColor: [0,0,0] },
    alternateRowStyles: { fillColor: [248,248,248] },
    margin: { left: 8, right: 8 }
  });

  doc.save('ConstruPRO_Folha_Pagamento.pdf');
}

function gerarPDFEPIs() {
  const doc = new window.jspdf.jsPDF();
  let y = pdfHeader(doc, 'Controle de EPIs', '');

  doc.autoTable({
    startY: y,
    head: [['EPI','Categoria','CA','Estoque','Mínimo','Validade','Status']],
    body: APP.epis.map(e => {
      let status = e.estoque < e.minimo ? 'CRÍTICO' : e.estoque < e.minimo*1.3 ? 'BAIXO' : 'OK';
      return [e.nome, e.categoria, e.ca, e.estoque, e.minimo, fmtDate(e.validade), status];
    }),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [239,68,68], textColor: [255,255,255] },
    margin: { left: 14, right: 14 }
  });

  y = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(50,50,50);
  doc.text('HISTÓRICO DE ENTREGAS', 14, y); y += 4;

  doc.autoTable({
    startY: y,
    head: [['EPI','Colaborador','Data','Quantidade','Devolvido']],
    body: APP.entregasEPI.map(e => {
      const epi = getEPI(e.epiId);
      const col = getColaborador(e.colaboradorId);
      return [epi?.nome||'—', col?.nome||'—', fmtDate(e.data), e.quantidade, e.devolvida?'Sim':'Não'];
    }),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [239,68,68], textColor: [255,255,255] },
    margin: { left: 14, right: 14 }
  });

  doc.save('ConstruPRO_EPIs.pdf');
}

function gerarPDFFinanceiro() {
  const doc = new window.jspdf.jsPDF();
  let y = pdfHeader(doc, 'Financeiro / DRE', '');

  const receitas = APP.financeiro.filter(f=>f.tipo==='Receita').reduce((a,b)=>a+b.valor,0);
  const despesas = APP.financeiro.filter(f=>f.tipo==='Despesa').reduce((a,b)=>a+b.valor,0);

  doc.autoTable({
    startY: y,
    head: [['Tipo','Descrição','Categoria','Data','Valor']],
    body: APP.financeiro.map(f => {
      const obra = getObra(f.obraId);
      return [f.tipo, f.descricao, f.categoria, fmtDate(f.data), (f.tipo==='Despesa'?'- ':'')+fmt(f.valor)];
    }),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [34,197,94], textColor: [0,0,0] },
    alternateRowStyles: { fillColor: [248,248,248] },
    margin: { left: 14, right: 14 }
  });

  y = doc.lastAutoTable.finalY + 8;
  const resultado = receitas - despesas;
  doc.setFontSize(9); doc.setTextColor(50,50,50);
  doc.text(`Receitas: ${fmt(receitas)}   Despesas: ${fmt(despesas)}   Resultado: ${fmt(resultado)}   Margem: ${receitas>0?(resultado/receitas*100).toFixed(1)+'%':'—'}`, 14, y);

  doc.save('ConstruPRO_Financeiro_DRE.pdf');
}
