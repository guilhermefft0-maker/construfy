<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstruPRO — Painel de Gestão</title>
  <!-- jsPDF carregado apenas quando necessário (relatórios) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0d0f12;
      --bg2: #13161b;
      --bg3: #1a1e25;
      --bg4: #222730;
      --border: #2a2f3a;
      --border2: #343b4a;
      --text: #e8eaf0;
      --text2: #8b92a5;
      --text3: #5a6075;
      --accent: #f0a500;
      --accent2: #c87e00;
      --green: #22c55e;
      --green2: #166534;
      --red: #ef4444;
      --red2: #7f1d1d;
      --blue: #3b82f6;
      --blue2: #1e3a6e;
      --purple: #a78bfa;
      --radius: 8px;
      --radius2: 12px;
      --sidebar: 220px;
      --font: 'IBM Plex Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; height:100vh; overflow:hidden; display:flex; }

    /* ── SIDEBAR ── */
    #sidebar { width:var(--sidebar); min-width:var(--sidebar); background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100vh; overflow-y:auto; }
    .logo { padding:20px 18px 16px; border-bottom:1px solid var(--border); }
    .logo-mark { font-size:18px; font-weight:600; color:var(--accent); letter-spacing:-0.5px; }
    .logo-mark span { color:var(--text); }
    .logo-sub { font-size:10px; color:var(--text3); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
    .nav-section { padding:16px 0 4px; }
    .nav-label { font-size:9px; color:var(--text3); letter-spacing:1.8px; text-transform:uppercase; padding:0 18px 8px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer; color:var(--text2); font-size:13px; font-weight:400; transition:all 0.15s; border-left:2px solid transparent; }
    .nav-item:hover { color:var(--text); background:var(--bg3); }
    .nav-item.active { color:var(--accent); background:rgba(240,165,0,0.07); border-left-color:var(--accent); }
    .nav-icon { width:16px; height:16px; opacity:0.7; flex-shrink:0; }
    .nav-item.active .nav-icon { opacity:1; }
    .sidebar-footer { margin-top:auto; padding:14px 18px; border-top:1px solid var(--border); }
    .user-pill { display:flex; align-items:center; gap:10px; }
    .user-avatar { width:30px; height:30px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#000; flex-shrink:0; }
    .user-name { font-size:12px; color:var(--text2); }
    .user-name-hi { font-size:12px; color:var(--text); font-weight:500; }

    /* ── MAIN ── */
    #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #topbar { height:52px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:12px; }
    .topbar-title { font-size:15px; font-weight:500; color:var(--text); flex:1; }
    .topbar-badge { background:var(--bg4); border:1px solid var(--border2); color:var(--text2); font-size:11px; padding:3px 10px; border-radius:20px; }
    #content { flex:1; overflow-y:auto; padding:24px; }

    /* ── BUTTONS ── */
    .btn { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:var(--radius); font-size:12px; font-weight:500; cursor:pointer; border:none; font-family:var(--font); transition:all 0.15s; }
    .btn-primary { background:var(--accent); color:#000; }
    .btn-primary:hover { background:var(--accent2); }
    .btn-outline { background:transparent; border:1px solid var(--border2); color:var(--text2); }
    .btn-outline:hover { background:var(--bg4); color:var(--text); }
    .btn-danger { background:transparent; border:1px solid var(--red2); color:var(--red); }
    .btn-success { background:rgba(34,197,94,0.1); border:1px solid var(--green2); color:var(--green); }
    .btn-success:hover { background:rgba(34,197,94,0.18); }

    /* ── KPI CARDS ── */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
    .kpi-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:18px; }
    .kpi-label { font-size:11px; color:var(--text3); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:8px; }
    .kpi-value { font-size:24px; font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
    .kpi-value.green { color:var(--green); }
    .kpi-value.amber { color:var(--accent); }
    .kpi-value.red   { color:var(--red); }
    .kpi-change { font-size:11px; color:var(--text3); margin-top:6px; }

    /* ── TABLES ── */
    .table-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); overflow:hidden; margin-bottom:20px; }
    .table-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .table-title { font-size:13px; font-weight:500; color:var(--text); }
    .table-sub { font-size:11px; color:var(--text3); margin-top:2px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:10px 16px; font-size:10px; color:var(--text3); letter-spacing:1.2px; text-transform:uppercase; border-bottom:1px solid var(--border); font-weight:500; }
    td { padding:11px 16px; font-size:13px; color:var(--text2); border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--bg3); }
    td .strong { color:var(--text); font-weight:500; }

    /* ── BADGES ── */
    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; }
    .badge-green  { background:rgba(34,197,94,0.12);  color:var(--green);  }
    .badge-amber  { background:rgba(240,165,0,0.12);  color:var(--accent); }
    .badge-red    { background:rgba(239,68,68,0.12);  color:var(--red);    }
    .badge-blue   { background:rgba(59,130,246,0.12); color:var(--blue);   }
    .badge-purple { background:rgba(167,139,250,0.12);color:var(--purple); }
    .badge-gray   { background:var(--bg4);            color:var(--text3);  }

    /* ── FORM OVERLAY ── */
    .form-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
    .form-overlay.open { display:flex; }
    .form-box { background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius2); padding:24px; width:560px; max-height:85vh; overflow-y:auto; }
    .form-title { font-size:15px; font-weight:500; color:var(--text); margin-bottom:18px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-group.full { grid-column:1/-1; }
    label { font-size:11px; color:var(--text3); letter-spacing:0.5px; }
    input, select, textarea { background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:var(--radius); padding:8px 12px; font-size:13px; font-family:var(--font); outline:none; transition:border 0.15s; width:100%; }
    input:focus, select:focus, textarea:focus { border-color:var(--accent); }
    select option { background:var(--bg3); }
    .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }

    /* ── PROGRESS ── */
    .progress-bar { height:5px; background:var(--bg4); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px; background:var(--accent); transition:width 0.3s; }
    .progress-fill.green { background:var(--green); }
    .progress-fill.red { background:var(--red); }

    /* ── LAYOUTS ── */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }

    /* ── MINI CHART ── */
    .mini-chart { display:flex; align-items:flex-end; gap:4px; height:60px; }
    .bar-col { flex:1; background:rgba(240,165,0,0.15); border-radius:3px 3px 0 0; border-top:2px solid var(--accent); min-height:4px; transition:height 0.3s; }
    .bar-col.green { background:rgba(34,197,94,0.15); border-top-color:var(--green); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

    /* ── DETAIL / FOLHA ── */
    .detail-panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:20px; }
    .folha-box { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; }
    .folha-item { display:flex; justify-content:space-between; padding:5px 0; font-size:12px; color:var(--text2); }
    .folha-item.total { border-top:1px solid var(--border2); margin-top:6px; padding-top:10px; font-weight:500; font-size:13px; color:var(--text); }
    .folha-deduct { color:var(--red); }
    .folha-plus { color:var(--green); }

    /* ── OBRA CARDS ── */
    .obra-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
    .obra-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius2); padding:16px; cursor:pointer; transition:all 0.15s; }
    .obra-card:hover { border-color:var(--border2); background:var(--bg3); }
    .obra-card.selected { border-color:var(--accent); }
    .obra-name { font-size:13px; font-weight:500; color:var(--text); margin-bottom:4px; }
    .obra-client { font-size:11px; color:var(--text3); margin-bottom:12px; }
    .obra-stats { display:flex; justify-content:space-between; margin-bottom:10px; }
    .obra-stat-val { font-size:16px; font-weight:500; color:var(--accent); }
    .obra-stat-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; }

    /* ── DOT ── */
    .dot { width:6px; height:6px; border-radius:50%; background:var(--red); flex-shrink:0; }
    .dot.green { background:var(--green); }
    .dot.amber { background:var(--accent); }

    /* ── SECTION TITLE ── */
    .section-title { font-size:13px; font-weight:500; color:var(--text); margin-bottom:12px; }

    /* ── ANIMATION ── */
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .page { animation:fadeIn 0.2s ease; }

    /* ── PRINT ── */
    @media print {
      #sidebar, #topbar { display:none; }
      #content { padding:0; overflow:visible; }
      body { height:auto; overflow:visible; }
    }
  </style>
</head>

<script>
// ── AUTH CHECK ──
const _user = (() => { try { return JSON.parse(localStorage.getItem('user')); } catch(e) { return null; } })();
if (!_user) { window.location.href = 'login.html'; }

const API = 'https://construpro-worker.guilhermefft0.workers.dev/api';
const CID = _user?.company_id || '';

const APP = {
  pontos: [],
  currentPage: 'dashboard',
  empresa: { nome: (_user?.company_name || _user?.name || 'Minha Empresa'), cnpj: '', regime: '' },
  obras: [],
  medicoes: [],
  faturamentos: [],
  colaboradores: [],
  epis: [],
  entregasEPI: [],
  financeiro: [],
  loading: false,
};

// ── TOKEN MANAGER (JWT + refresh automático) ─────────────────────
const TokenManager = {
  get() { return localStorage.getItem('access_token') || ''; },

  isExpired() {
    const exp = parseInt(localStorage.getItem('token_exp') || '0');
    return Date.now() > (exp - 60_000); // renova 60s antes
  },

  async refresh() {
    try {
      const res = await fetch(`${API}/auth/refresh`, {
        method: 'POST',
        credentials: 'include',
      });
      if (!res.ok) { logout(); return false; }
      const data = await res.json();
      if (data.ok && data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('token_exp', String(Date.now() + data.expires_in * 1000));
        return true;
      }
      logout();
      return false;
    } catch { return false; }
  },

  async getValid() {
    if (this.isExpired()) await this.refresh();
    return this.get();
  }
};

// Tenta renovar ao carregar se o token está prestes a expirar
if (TokenManager.isExpired()) TokenManager.refresh();

// ── API HELPER ─────────────────────────────────────────────────────
async function apiGet(endpoint) {
  try {
    const token = await TokenManager.getValid();
    const res = await fetch(`${API}/data/${endpoint}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'X-Company-ID': CID },
    });
    if (res.status === 401) { logout(); return []; }
    const data = await res.json();
    return data.items ?? data.results ?? data ?? [];
  } catch(e) { console.error('apiGet error', endpoint, e); return []; }
}

async function apiPost(endpoint, body) {
  try {
    const token = await TokenManager.getValid();
    const res = await fetch(`${API}/data/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, 'X-Company-ID': CID },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { logout(); return {}; }
    return res.json();
  } catch(e) { console.error('apiPost error', endpoint, e); return {}; }
}

async function apiPut(endpoint, body) {
  try {
    const token = await TokenManager.getValid();
    const res = await fetch(`${API}/data/${endpoint}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, 'X-Company-ID': CID },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { logout(); return {}; }
    return res.json();
  } catch(e) { console.error('apiPut error', endpoint, e); return {}; }
}

async function apiDelete(endpoint) {
  try {
    const token = await TokenManager.getValid();
    const res = await fetch(`${API}/data/${endpoint}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}`, 'X-Company-ID': CID },
    });
    if (res.status === 401) { logout(); return {}; }
    return res.json();
  } catch(e) { console.error('apiDelete error', endpoint, e); return {}; }
}

// ── LOADING STATE ──────────────────────────────────────
function showLoading() {
  document.getElementById('content').innerHTML = `
    <div class="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:14px">
      <div style="width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
      <div style="color:var(--text3);font-size:13px">Carregando dados...</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
}

// ── LOAD ALL DATA (batch — 1 request só) ──────────────
async function loadAll() {
  showLoading();
  try {
    const token = await TokenManager.getValid();
    const res = await fetch(`${API}/data/all`, {
      headers: { 'Authorization': `Bearer ${token}`, 'X-Company-ID': CID },
    });
    if (res.status === 401) { logout(); return; }
    const d = await res.json();
    APP.obras         = (d.obras         || []).map(normalizeObra);
    APP.medicoes      = (d.medicoes       || []).map(normalizeMedicao);
    APP.faturamentos  = (d.faturamentos   || []).map(normalizeFat);
    APP.colaboradores = (d.colaboradores  || []).map(normalizeColab);
    APP.epis          = (d.epis           || []).map(normalizeEPI);
    APP.entregasEPI   = d.entregasEPI     || [];
    APP.financeiro    = (d.financeiro     || []).map(normalizeFin);
    APP.pontos        = (d.pontos         || []).map(normalizePonto);
  } catch(e) {
    console.error('loadAll error', e);
    // Fallback: tenta individual se o batch falhar
    const [obras, medicoes, faturamentos, colaboradores, epis, entregasEPI, financeiro, pontos] = await Promise.all([
      apiGet('obras'), apiGet('medicoes'), apiGet('faturamentos'),
      apiGet('colaboradores'), apiGet('epis'), apiGet('entregas-epi'),
      apiGet('financeiro'), apiGet('pontos')
    ]);
    APP.obras         = (obras         || []).map(normalizeObra);
    APP.medicoes      = (medicoes      || []).map(normalizeMedicao);
    APP.faturamentos  = (faturamentos  || []).map(normalizeFat);
    APP.colaboradores = (colaboradores || []).map(normalizeColab);
    APP.epis          = (epis          || []).map(normalizeEPI);
    APP.entregasEPI   = entregasEPI    || [];
    APP.financeiro    = (financeiro    || []).map(normalizeFin);
    APP.pontos        = (pontos        || []).map(normalizePonto);
  }
  navigate(APP.currentPage);
}

// ── NORMALIZERS (DB snake_case → JS camelCase) ─────────
function normalizeObra(o) {
  return { ...o, prevFim: o.prev_fim, medicoes: o.medicoes_count, valorContrato: o.valor_contrato || 0 };
}
function normalizeMedicao(m) {
  return { ...m, obraId: m.obra_id };
}
function normalizeFat(f) {
  return { ...f, obraId: f.obra_id, formaPgto: f.forma_pgto };
}
function normalizeColab(c) {
  return { ...c, obraId: c.obra_id, diasTrabalhados: c.dias_trabalhados };
}
function normalizeEPI(e) { return e; }
function normalizeFin(f) {
  return { ...f, obraId: f.obra_id };
}
function normalizePonto(p) {
  return { ...p, colaborador_id: p.colaborador_id, hora_entrada: p.hora_entrada, hora_saida: p.hora_saida };
}

function calcularINSS(salario) {
  const limites = [1412.00, 2666.68, 4000.03, 7786.02];
  const aliq = [0.075, 0.09, 0.12, 0.14];
  let inss = 0;
  for (let i = 0; i < limites.length; i++) {
    const prev = i === 0 ? 0 : limites[i-1];
    if (salario > prev) inss += (Math.min(salario, limites[i]) - prev) * aliq[i];
    if (salario <= limites[i]) break;
  }
  return Math.min(inss, 7786.02 * 0.14);
}

function calcularIRRF(salarioBruto, inss) {
  const base = salarioBruto - inss;
  const faixas = [
    { ate: 2259.20, aliq: 0, ded: 0 },
    { ate: 2826.65, aliq: 0.075, ded: 169.44 },
    { ate: 3751.05, aliq: 0.15, ded: 381.44 },
    { ate: 4664.68, aliq: 0.225, ded: 662.77 },
    { ate: Infinity, aliq: 0.275, ded: 896.00 },
  ];
  for (const f of faixas) {
    if (base <= f.ate) return Math.max(0, base * f.aliq - f.ded);
  }
  return 0;
}

function calcularLiquidoCLT(salario) {
  const inss = calcularINSS(salario);
  const irrf = calcularIRRF(salario, inss);
  const fgts = salario * 0.08;
  const prov13 = salario / 12;
  const provFerias = (salario / 12) * (1 + 1/3);
  const liquido = salario - inss - irrf;
  const custoTotal = salario + fgts + prov13 + provFerias;
  return { inss, irrf, fgts, prov13, provFerias, liquido, custoTotal };
}

function filtrarPontoPorData(data) {
  window.PONTO_DATA_FILTRO = data;
  navigate('ponto');
}

function navegarDia(delta) {
  const atual = new Date(window.PONTO_DATA_FILTRO + 'T00:00:00');
  atual.setDate(atual.getDate() + delta);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (atual > hoje) return; // não permite ir além de hoje
  window.PONTO_DATA_FILTRO = atual.toISOString().split('T')[0];
  navigate('ponto');
}

async function editarBatida(id, tipo) {
  const ponto = APP.pontos.find(p => p.id === id);
  if (!ponto) return;
  const agora = new Date().toTimeString().slice(0,5);
  if (tipo === 'entrada') {
    ponto.hora_entrada = agora;
    ponto.status = 'presente';
  } else {
    ponto.hora_saida = agora;
  }
  await apiPut(`pontos/${id}`, {
    hora_entrada: ponto.hora_entrada || null,
    hora_saida:   ponto.hora_saida   || null,
    status:       ponto.status,
    obs:          ponto.obs
  });
  navigate('ponto');
}

async function salvarPonto() {
  const colId  = document.getElementById('f-colaborador').value;
  const data   = document.getElementById('f-data').value;
  const status = document.getElementById('f-status').value;
  const obs    = document.getElementById('f-obs').value.trim();
  const col    = APP.colaboradores.find(c => c.id == colId);
  if (!col)  return alert('Selecione um colaborador');
  if (!data) return alert('Informe a data');

  const jaExiste = APP.pontos.find(p => (p.colaborador_id || p.colaboradorId) === colId && p.data === data);
  if (jaExiste) {
    if (!confirm(`Já existe um registro de ${col.nome} em ${new Date(data+'T00:00:00').toLocaleDateString('pt-BR')}. Deseja substituir?`)) return;
    await apiDelete(`pontos/${jaExiste.id}`);
    APP.pontos = APP.pontos.filter(p => p.id !== jaExiste.id);
  }

  const payload = {
    colaboradorId:   colId,
    colaboradorNome: col.nome,
    cargo:           col.cargo,
    data,
    horaEntrada: status === 'presente' ? (document.getElementById('f-entrada').value || null) : null,
    horaSaida:   status === 'presente' ? (document.getElementById('f-saida').value   || null) : null,
    status,
    obs: obs || (status === 'presente' ? 'Registro administrativo' : 'Falta registrada pelo administrador'),
  };

  const novo = await apiPost('pontos', payload);
  APP.pontos.unshift({
    id:               novo?.id || ('ponto' + Date.now()),
    colaborador_id:   colId,
    colaborador_nome: col.nome,
    cargo:            col.cargo,
    data,
    hora_entrada: payload.horaEntrada,
    hora_saida:   payload.horaSaida,
    status:       payload.status,
    obs:          payload.obs,
  });
  window.PONTO_DATA_FILTRO = data;
  closeForm();
  navigate('ponto');
}

function exportPontoCSV() {
  const data = window.PONTO_DATA_FILTRO;
  const pontos = APP.pontos.filter(p => p.data === data);
  let csv = 'Data,Colaborador,Cargo,Entrada,Saída,Status,Observações\n';
  pontos.forEach(p => {
    csv += `"${p.data}","${p.colaborador_nome}","${p.cargo}","${p.hora_entrada || ''}","${p.hora_saida || ''}","${p.status}","${p.obs}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ponto_${data}.csv`;
  a.click();
}

async function salvarObra(id) {
  const nome = document.getElementById('f-nome').value.trim();
  if (!nome) return alert('Informe o nome da obra');
  const payload = {
    nome,
    cliente:         document.getElementById('f-cliente').value.trim(),
    contrato:        document.getElementById('f-contrato').value.trim(),
    valorContrato:   parseFloat(document.getElementById('f-valor-contrato').value)||0,
    inicio:          document.getElementById('f-inicio').value,
    prevFim:         document.getElementById('f-prevfim').value,
    status:          document.getElementById('f-status').value,
    avanco:          parseInt(document.getElementById('f-avanco').value)||0,
  };
  if (id) {
    await apiPut(`obras/${id}`, payload);
    const o = APP.obras.find(x=>x.id===id);
    if (o) Object.assign(o, payload);
  } else {
    const nova = await apiPost('obras', payload);
    if (nova?.id) APP.obras.push(normalizeObra({ ...payload, id: nova.id, medicoes_count: 0, faturado: 0, despesas: 0, valor_contrato: payload.valorContrato }));
  }
  closeForm();
  navigate('obras');
}

// ── FOLHA ──
function renderFolha() {
  const cltAtivos = APP.colaboradores.filter(c=>c.status==='Ativo'&&c.tipo==='CLT');
  const diaristas = APP.colaboradores.filter(c=>c.status==='Ativo'&&c.tipo==='Diarista');
  const totalBruto = cltAtivos.reduce((a,c)=>a+c.salario,0) + diaristas.reduce((a,c)=>a+(c.salario*(c.diasTrabalhados||22)),0);
  const totalLiq = cltAtivos.reduce((a,c)=>{ const r=calcularLiquidoCLT(c.salario); return a+r.liquido; },0)
                 + diaristas.reduce((a,c)=>a+(c.salario*(c.diasTrabalhados||22)),0);
  const totalCusto = cltAtivos.reduce((a,c)=>{ const r=calcularLiquidoCLT(c.salario); return a+r.custoTotal; },0)
                   + diaristas.reduce((a,c)=>a+(c.salario*(c.diasTrabalhados||22)),0);

  return `
  <div style="font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px">Folha de Pagamento</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:20px">${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div>

  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
    <div class="kpi-card"><div class="kpi-label">Total Bruto</div><div class="kpi-value amber">${fmt(totalBruto)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Total Líquido</div><div class="kpi-value green">${fmt(totalLiq)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Custo Total Empresa</div><div class="kpi-value red">${fmt(totalCusto)}</div></div>
  </div>

  <div class="table-card" style="margin-bottom:20px">
    <div class="table-header"><div class="table-title">CLT — Holerites</div></div>
    <table>
      <thead><tr><th>Colaborador</th><th>Cargo</th><th>Bruto</th><th>INSS</th><th>IRRF</th><th>Líquido</th><th>FGTS</th><th>Custo Empresa</th></tr></thead>
      <tbody>
        ${cltAtivos.map(c => {
          const r = calcularLiquidoCLT(c.salario);
          return `<tr>
            <td><span class="strong">${c.nome}</span></td>
            <td>${c.cargo}</td>
            <td style="font-family:var(--mono)">${fmt(c.salario)}</td>
            <td style="font-family:var(--mono);color:var(--red)">-${fmt(r.inss)}</td>
            <td style="font-family:var(--mono);color:var(--red)">-${fmt(r.irrf)}</td>
            <td style="font-family:var(--mono);color:var(--green);font-weight:500">${fmt(r.liquido)}</td>
            <td style="font-family:var(--mono);color:var(--text3)">${fmt(r.fgts)}</td>
            <td style="font-family:var(--mono);color:var(--accent)">${fmt(r.custoTotal)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>

  ${diaristas.length ? `
  <div class="table-card">
    <div class="table-header"><div class="table-title">Diaristas</div></div>
    <table>
      <thead><tr><th>Colaborador</th><th>Cargo</th><th>Diária</th><th>Dias</th><th>Total</th></tr></thead>
      <tbody>
        ${diaristas.map(c => `<tr>
          <td><span class="strong">${c.nome}</span></td>
          <td>${c.cargo}</td>
          <td style="font-family:var(--mono)">${fmt(c.salario)}</td>
          <td>${c.diasTrabalhados||22}</td>
          <td style="font-family:var(--mono);color:var(--accent)">${fmt(c.salario*(c.diasTrabalhados||22))}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>` : ''}`;
}

async function salvarEntregaEPI() {
  const epiId = document.getElementById('f-epi').value;
  const qtd   = parseInt(document.getElementById('f-qtd').value)||1;
  const epi   = getEPI(parseInt(epiId));
  if (epi && epi.estoque < qtd) return alert('Estoque insuficiente!');
  const payload = {
    epi_id:          epiId,
    colaborador_id:  document.getElementById('f-col').value,
    data:            document.getElementById('f-data').value,
    quantidade:      qtd,
    devolvida:       false
  };
  const nova = await apiPost('entregas-epi', payload);
  if (nova?.id) {
    if (epi) epi.estoque -= qtd;
    APP.entregasEPI.push({ ...payload, id: nova.id, epiId: parseInt(epiId), colaboradorId: parseInt(payload.colaborador_id) });
  }
  closeForm();
  navigate('epis');
}

function renderFinanceiro() {
  const receitas = APP.financeiro.filter(f=>f.tipo==='Receita').reduce((a,b)=>a+b.valor,0);
  const despesas = APP.financeiro.filter(f=>f.tipo==='Despesa').reduce((a,b)=>a+b.valor,0);
  const saldo = receitas - despesas;

  const cats = {};
  APP.financeiro.filter(f=>f.tipo==='Despesa').forEach(f=>{ cats[f.categoria]=(cats[f.categoria]||0)+f.valor; });

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div><div style="font-size:20px;font-weight:500;color:var(--text)">Financeiro</div>

  </div>

  <div class="two-col" style="margin-bottom:20px">
    <div class="table-card">
      <div class="table-header"><div class="table-title">Despesas por Categoria</div></div>
      <div style="padding:16px">
        ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>{
          const pct = Math.round((val/despesas)*100);
          return `<div style="margin-bottom:14px">

        <thead><tr><th>Descrição</th><th>Data</th><th>Tipo</th><th>Valor</th></tr></thead>
        <tbody>
          ${[...APP.financeiro].reverse().slice(0,8).map(f=>`<tr>
            <td><span class="strong">${trunc(f.descricao,22)}</span></td>

// ── LAZY jsPDF LOADER ──
let _jspdfLoaded = false;
async function _ensureJsPDF() {
  if (_jspdfLoaded) return;
  await new Promise((res, rej) => {
    const s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
      s2.onload = () => { _jspdfLoaded = true; res(); };
      s2.onerror = rej;
      document.head.appendChild(s2);
    };
    s1.onerror = rej;
    document.head.appendChild(s1);
  });
}

// ── PDF GENERATORS ──
function _initPDF(titulo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(13,15,18);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.setTextColor(240,165,0);
  doc.text('ConstruPRO', 14, 18);
  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  doc.setTextColor(180,180,180);
  doc.text(titulo, 14, 26);
  doc.setFontSize(9);
  doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 32);
  doc.setDrawColor(50,50,60);
  doc.line(14, 35, 196, 35);
  return doc;
}

async function gerarPDFObras() {
  await _ensureJsPDF();
  const doc = _initPDF('Relatório de Obras');
  doc.autoTable({
    startY: 40,
    head: [['Obra','Cliente','Status','Avanço','Faturado','Despesas','Resultado']],
    body: APP.obras.map(o => [o.nome, o.cliente, o.status, o.avanco+'%',
      fmt(o.faturado), fmt(o.despesas), fmt(o.faturado-o.despesas)]),
    styles: { fontSize:9, textColor:[200,200,210] },
    headStyles: { fillColor:[34,40,52], textColor:[240,165,0] },
    alternateRowStyles: { fillColor:[22,26,33] },
  });
  doc.save('obras.pdf');
}

async function gerarPDFFolha() {
  await _ensureJsPDF();
  const doc = _initPDF('Folha de Pagamento — ' + new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const clt = APP.colaboradores.filter(c=>c.status==='Ativo'&&c.tipo==='CLT');
  doc.autoTable({
    startY: 40,
    head: [['Colaborador','Cargo','Bruto','INSS','IRRF','Líquido','FGTS','Custo Empresa']],
    body: clt.map(c => {
      const r = calcularLiquidoCLT(c.salario);
      return [c.nome, c.cargo, fmt(c.salario), fmt(r.inss), fmt(r.irrf), fmt(r.liquido), fmt(r.fgts), fmt(r.custoTotal)];
    }),
    styles: { fontSize:8, textColor:[200,200,210] },
    headStyles: { fillColor:[34,40,52], textColor:[240,165,0] },
    alternateRowStyles: { fillColor:[22,26,33] },
  });
  doc.save('folha.pdf');
}

async function gerarPDFFinanceiro() {
  await _ensureJsPDF();
  const doc = _initPDF('DRE Simplificado');
  const receitas = APP.financeiro.filter(f=>f.tipo==='Receita').reduce((a,b)=>a+b.valor,0);
  const despesas = APP.financeiro.filter(f=>f.tipo==='Despesa').reduce((a,b)=>a+b.valor,0);
  doc.autoTable({
    startY: 40,
    head: [['Descrição','Categoria','Tipo','Data','Valor']],
    body: APP.financeiro.map(f=>[f.descricao, f.categoria, f.tipo, fmtDate(f.data), fmt(f.valor)]),
    styles: { fontSize:9, textColor:[200,200,210] },
    headStyles: { fillColor:[34,40,52], textColor:[240,165,0] },
    alternateRowStyles: { fillColor:[22,26,33] },
  });
  const y = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(10); doc.setTextColor(180,220,180);
  doc.text(`Total Receitas: ${fmt(receitas)}`, 14, y);
  doc.setTextColor(220,100,100);
  doc.text(`Total Despesas: ${fmt(despesas)}`, 14, y+7);
  doc.setTextColor(240,165,0);
  doc.text(`Resultado: ${fmt(receitas-despesas)}`, 14, y+14);
  doc.save('financeiro.pdf');
}

function gerarPDFEPIs() {
  const doc = _initPDF('Estoque de EPIs');
  doc.autoTable({
    startY: 40,
    head: [['EPI','Categoria','CA','Estoque','Mínimo','Validade','Status']],
    body: APP.epis.map(e=>[e.nome, e.categoria, e.ca, e.estoque, e.minimo, fmtDate(e.validade),
      e.estoque<e.minimo?'CRÍTICO':e.estoque<e.minimo*1.3?'Baixo':'OK']),
    styles: { fontSize:9, textColor:[200,200,210] },
    headStyles: { fillColor:[34,40,52], textColor:[240,165,0] },
    alternateRowStyles: { fillColor:[22,26,33] },
  });
  doc.save('epis.pdf');
}

function gerarPDFColaboradores() {
  const doc = _initPDF('Colaboradores');
  doc.autoTable({
    startY: 40,
    head: [['Nome','CPF','Cargo','Tipo','Salário','Admissão','Status']],
    body: APP.colaboradores.map(c=>[c.nome, c.cpf, c.cargo, c.tipo,
      c.tipo==='Diarista'?fmt(c.salario)+'/dia':fmt(c.salario),
      fmtDate(c.admissao), c.status]),
    styles: { fontSize:8, textColor:[200,200,210] },
    headStyles: { fillColor:[34,40,52], textColor:[240,165,0] },
    alternateRowStyles: { fillColor:[22,26,33] },
  });
  doc.save('colaboradores.pdf');
}

(function initUser() {
  const u = _user;
  if (!u) return;
  const name = u.name || u.email || 'Usuário';
  const email = u.email || '';
  const initials = name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('user-initials').textContent = initials;
  document.getElementById('user-display-name').textContent = name;
  document.getElementById('user-display-email').textContent = email;
  const badge = document.getElementById('empresa-badge');
  if (badge) badge.textContent = name;
})();

function logout() {
  // Revoga o refresh token no servidor (invalida a sessão)
  fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include' }).catch(() => {});
  localStorage.removeItem('user');
  localStorage.removeItem('access_token');
  localStorage.removeItem('token_exp');
  window.location.href = 'login.html';
}
