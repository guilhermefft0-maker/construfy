name = "construpro-worker"
main = "worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ── Produção
[vars]
ENVIRONMENT = "production"

# ── D1 Database (multi-tenant SQLite)
[[d1_databases]]
binding    = "DB"
database_name = "construFY-db"
database_id   = "87050e49-29d9-459a-a7d4-4cdfe42e4484"  # **SECURITY: Replace before deploy**

# ── KV Namespace (rate limiting)
[[kv_namespaces]]
binding = "RATE_KV"
id      = "32d4a3cb8a4c4f909064d0f8654cc88c"  # **SECURITY: Replace before deploy**

# ── Secrets (configurar via: wrangler secret put NOME)
# JWT_SECRET     → string aleatória ≥ 64 caracteres
# RESEND_API_KEY → chave da API do Resend.com para e-mails transacionais

# ── Cron Trigger (limpeza de sessões expiradas — diário às 3h UTC)
[triggers]
crons = ["0 3 * * *"]

# ── Rotas
[[routes]]
pattern = "your-domain.com/api/*"  # **SECURITY: Replace with your custom domain**
zone_name = "your-domain.com"

# ── Configurações de segurança
[build]
command = ""


# ── Observabilidade
[observability]
enabled = true
head_sampling_rate = 1